services:
  redis:
    image: redis:7-alpine
    container_name: link-cloud-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "6379:6379"

  api:
    build: .
    container_name: link-cloud-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      REDIS_HOST: redis
      DB_HOST: host.docker.internal
    ports:
      - "${PORT:-4000}:${PORT:-4000}" # must match nginx's proxy_pass target on this host - see .env's PORT
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis

  worker:
    build: .
    container_name: link-cloud-worker
    restart: unless-stopped
    command: ["node", "src/workers/downloadWorker.js"]
    env_file: .env
    environment:
      NODE_ENV: production
      REDIS_HOST: redis
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./storage:/app/storage
    depends_on:
      - redis
